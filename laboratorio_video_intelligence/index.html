<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HormigasAIS — Video Intelligence LAB</title>

<style>
:root{
    --amarillo:#f5c518;
    --verde:#00ff9f;
    --rojo:#ff4444;
    --gris:#8892a0;
    --bg:#0b0f19;
    --panel:#111827;
    --border:#1f2937;
    --azul:#38bdf8;
}

body{
    margin:0;
    background:var(--bg);
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:2rem 1rem;
}

.container{
    max-width:760px;
    margin:auto;
}

.header{
    background:linear-gradient(
        135deg,
        rgba(245,197,24,.05),
        rgba(0,255,159,.03)
    );

    border:1px solid var(--border);
    border-radius:18px;
    padding:2rem;
    text-align:center;
    margin-bottom:2rem;
}

.header h1{
    margin:.5rem 0;
    font-size:1.4rem;
}

.panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:1.5rem;
    margin-bottom:1.5rem;
}

.input-group{
    display:flex;
    gap:.5rem;
    margin-top:.7rem;
}

input{
    flex:1;
    background:#070a12;
    border:1px solid #2d3748;
    border-radius:8px;
    padding:.9rem;
    color:white;
    font-family:monospace;
}

button{
    background:rgba(56,189,248,.1);
    border:1px solid rgba(56,189,248,.3);
    color:var(--azul);
    border-radius:8px;
    padding:0 1.3rem;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:var(--azul);
    color:black;
}

.resultado{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:2rem;
    text-align:center;
}

.oraculo{
    width:100px;
    height:100px;
    border-radius:50%;
    margin:auto auto 1rem auto;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:2rem;

    background:#1f2937;
    border:4px solid #2d3748;

    transition:all .4s ease;
}

.estado-procesando{
    border-color:var(--amarillo);
    box-shadow:0 0 20px rgba(245,197,24,.4);
    animation:pulso 1.5s infinite;
}

.estado-humano{
    border-color:var(--verde);
    box-shadow:0 0 20px rgba(0,255,159,.4);
    background:rgba(0,255,159,.1);
}

.estado-ia{
    border-color:var(--rojo);
    box-shadow:0 0 20px rgba(255,68,68,.4);
    background:rgba(255,68,68,.1);
}

.estado-mixto{
    border-color:var(--azul);
    box-shadow:0 0 20px rgba(56,189,248,.4);
    background:rgba(56,189,248,.1);
}

@keyframes pulso{
    0%{transform:scale(1);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
}

.estado{
    font-size:1.1rem;
    font-weight:700;
    margin-bottom:.5rem;
}

.subtexto{
    font-size:.8rem;
    color:#999;
}

.metricas{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1rem;
    margin-top:1.5rem;
}

.score-box{
    background:#070a12;
    border:1px solid #1f2937;
    border-radius:10px;
    padding:1rem;
}

.score-num{
    font-size:1.7rem;
    font-weight:800;
}

.telemetria{
    margin-top:1.5rem;
    text-align:left;
    background:#070a12;
    border:1px solid #1f2937;
    border-radius:10px;
    padding:1rem;
    overflow:auto;
    font-size:.72rem;
    display:none;
    color:#9ca3af;
    font-family:monospace;
}

.footer{
    text-align:center;
    color:#333;
    margin-top:2rem;
    font-size:.7rem;
    font-family:monospace;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div>🐜</div>

<h1>HormigasAIS — Video Intelligence LAB</h1>

<p style="color:#888;font-size:.8rem;">
Motor neutral de evaluación biológica IA vs Humano
</p>
</div>

<div class="panel">

<label style="font-size:.75rem;color:#aaa;font-family:monospace;">
LINK_VIDEO_ANALISIS_>
</label>

<div class="input-group">

<input
type="text"
id="videoUrl"
placeholder="TikTok, YouTube, Facebook, X..."
>

<button onclick="procesarVideoLBH()">
ANALIZAR
</button>

</div>
</div>

<div class="resultado">

<div class="oraculo" id="oraculo">
👁️
</div>

<div class="estado" id="estado">
Esperando análisis...
</div>

<div class="subtexto" id="subtexto">
La colonia aún no ha emitido feromonas.
</div>

<div class="metricas">

<div class="score-box">
<div>HUMANO</div>
<div class="score-num" id="scoreHumano">0</div>
</div>

<div class="score-box">
<div>IA GENERATIVA</div>
<div class="score-num" id="scoreIA">0</div>
</div>

</div>

<div class="telemetria" id="telemetria"></div>

</div>

<div class="footer">
HormigasAIS LAB · Nodo A16 · Arquitectura Neutral
</div>

</div>

<script>

async function procesarVideoLBH(){

    const url = document
        .getElementById('videoUrl')
        .value
        .trim();

    if(!url){
        alert('Inserta una URL válida');
        return;
    }

    const oraculo = document.getElementById('oraculo');
    const estado = document.getElementById('estado');
    const subtexto = document.getElementById('subtexto');
    const telemetria = document.getElementById('telemetria');

    const scoreHumano =
        document.getElementById('scoreHumano');

    const scoreIA =
        document.getElementById('scoreIA');

    oraculo.className = 'oraculo estado-procesando';
    oraculo.innerHTML = '⏳';

    estado.innerHTML =
        'Procesando consistencia temporal...';

    subtexto.innerHTML =
        'El enjambre está evaluando continuidad biológica.';

    scoreHumano.innerHTML = '--';
    scoreIA.innerHTML = '--';

    telemetria.style.display = 'none';

    try{

        const response = await fetch('/api/analizar',{

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify({
                url:url
            })

        });

        if(!response.ok){
            throw new Error('Nodo no disponible');
        }

        const feromona = await response.json();

        const humano =
            Number(feromona.score_humano || 0);

        const ia =
            Number(feromona.score_ia || 0);

        scoreHumano.innerHTML = humano;
        scoreIA.innerHTML = ia;

        if(ia >= 70){

            oraculo.className =
                'oraculo estado-ia';

            oraculo.innerHTML = '🤖';

            estado.innerHTML =
                'IA GENERATIVA DETECTADA';

            subtexto.innerHTML =
                feromona.analisis_motivo ||
                'La colonia detectó patrones sintéticos';

        }

        else if(humano >= 70){

            oraculo.className =
                'oraculo estado-humano';

            oraculo.innerHTML = '👤';

            estado.innerHTML =
                'PRESENCIA HUMANA CONFIRMADA';

            subtexto.innerHTML =
                feromona.analisis_motivo ||
                'Continuidad orgánica consistente';

        }

        else{

            oraculo.className =
                'oraculo estado-mixto';

            oraculo.innerHTML = '🧬';

            estado.innerHTML =
                'RESULTADO INDETERMINADO';

            subtexto.innerHTML =
                'Las evidencias biológicas son mixtas';

        }

        telemetria.innerHTML =
            '<strong>LBH_FEROMONA</strong><br><br>' +

            JSON.stringify(
                feromona,
                null,
                2
            )
            .replace(/\n/g,'<br>')
            .replace(/ /g,'&nbsp;');

        telemetria.style.display = 'block';

    }

    catch(err){

        oraculo.className = 'oraculo';

        oraculo.innerHTML = '❌';

        estado.innerHTML =
            'ERROR EN EL NODO';

        subtexto.innerHTML =
            err.message;
    }
}
</script>

</body>
</html>
