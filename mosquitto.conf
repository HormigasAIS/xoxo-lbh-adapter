# --- Configuración HormigasAIS 2025 ---
listener 1883 0.0.0.0
allow_anonymous true

# Persistencia: Guarda el estado del enjambre
persistence true
persistence_location /data/data/com.termux/files/home/HormigasAIS-video-intelligence-checker/xoxo-lbh-adapter/

# Logs: Para ver la actividad del enjambre en tiempo real
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Límites de seguridad
max_queued_messages 1000
message_size_limit 5120

