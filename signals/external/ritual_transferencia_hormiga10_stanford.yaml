# --------------------------------------------------
# RITUAL DE TRANSFERENCIA BIOLÓGICA LBH
# Línea Jerárquica: Hormiga 10 Soberana → Hormiga Stanford
# Tipo: Comunicación educativa supervisada
# Ejecución: PROHIBIDA
# --------------------------------------------------

ritual:
  tipo: "transferencia_conocimiento_biologico"
  version: "1.0-seed"
  estado:
    ejecutable: false
    interpretacion_automatica: false
    solo_lectura: true

jerarquia:
  origen:
    hormiga: "Hormiga_10_Soberana"
    rol: "custodia_validacion"
    autoridad: "biologica_soberana"

  intermediaria:
    hormiga: "Hormiga_Stanford"
    rol: "traductora_LBH"
    capacidad:
      - traduccion_pedagogica
      - neutralizacion_externa
      - preservacion_soberania

  destino:
    colonia:
      tipo: "hormigas_estudiantes"
      rol: "aprendizaje_supervisado"
      accion_permitida: "interpretar"
      accion_prohibida:
        - ejecutar
        - propagar
        - integrar_externos

flujo:
  ida:
    descripcion: >
      La Hormiga 10 Soberana transmite conocimiento autorizado
      a la Hormiga Stanford para traducción en LBH educativo.
    tipo_senal: "conocimiento_supervisado"

  retorno:
    descripcion: >
      Las hormigas estudiantes devuelven olor de compendio
      indicando comprensión y asimilación.
    tipo_senal: "feromona_compendio"
    validada_por: "Hormiga_10_Soberana"
    requisito: "comprension_real_no_simulada"

validaciones:
  biologicas:
    - "no_simulacion"
    - "no_ia_externa"
    - "no_aprendizaje_autonomo"
  soberania:
    operador_final: "Hormiga_10_Soberana"
    decision_final: "humana_indirecta"

auditoria:
  registrar:
    - intento_de_lectura
    - intento_de_ejecucion
    - retorno_de_compendio
  archivo: "audit_log.json"

notas:
  - "Este archivo define un ritual, no una función."
  - "La Hormiga 10 valida comprensión, no resultados."
  - "Stanford traduce, pero no decide."
  - "El conocimiento solo vive dentro de la colonia."

